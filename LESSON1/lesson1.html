<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HTML Basics</title>
    <style>
        
        .amazon-link{color: rgb(0, 113, 133);
            font-weight: bold;
        }

        .Add-button {
            background-color: rgb(255, 216, 20);
            color: black;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
        .Buy-button {
            background-color: rgb(255, 164, 28);
            color: black;
            padding: 10px 20px;
            border-radius: 35px;
            font-size: 16px;
            cursor: pointer;
        }
        span {
            color:green;
            font-weight: bold;
        }
        .Topic-button {
            font-size: 20px;
            color: black;
            font-weight: bold;
        }

    </style>
</head>

<body>
    <button class="Click-button">Click Me</button> <br>
    <button class="Name-button">Kumala Adugna</button>
    <button class="Favorite-button">Juice</button>
    <p>Hello, World!</p>
    <p>Thanks to God for everything He did for us through Christ. Because of Him I rejoice everyday with his grace, Spirit.</p>
     <a href="https://www.google.com" target="_blank">Search with Google</a>

<hr>
    <a class= "amazon-link" href="https://www.amazon.com" target="_blank">Back to Amazon</a>
    <p class="Topic-button">Nike Black Running Shoes </p>
  
    <p><span>$39-in stock.</span> <br> Free delivery tomorrow. <br>
      <button class="Add-button">Add to Cart</button>
      <button class="Buy-button">Buy Now</button>
    </p>


</body>
</html>
