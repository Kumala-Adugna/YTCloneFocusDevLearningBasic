<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Transition,Hovering and Box Shadow</title>
    <style>
        .Uber-button {
            background-color: black;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 25px;
            transition: background-color 0.15s;
          
        }
        .Uber-button:hover{
            background-color:oklab(32.812000000000005% -0.02115 -0.03178);
            color:#0fac09;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.6);
         }
         .Uber-button:active{
            opacity:0.7;
         }
        .Amazon-button {
            background-color: rgb(255, 223, 63);
            color: rgb(0, 0, 0);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            width: 200px;
            margin-left: 26px;
            transition: background-color 0.75s;
        }
        .Amazon-button:hover{
            background-color:hsla(39, 84%, 53%, 0.918);
        }
        .Amazon-button:active{
            opacity:0.8;
        }
        .Github-button {
            background-color: rgb(46, 164, 79);
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
            margin-left: 6px;
            height: 50px;
            width: 120px;
            margin-left: 30px;

        }
        .Github-button:hover{
            background-color: rgb(46, 164, 79);
            box-shadow: 5px 5px 10px rgba(202, 200, 200, 0.6);
         }
        .Github-button:active{
            opacity:0.5;
        }
        .Bootsrap-button {
            background-color: rgb(121, 82, 179);
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .Bootsrap-button:hover{
            background-color:rgb(99, 65, 151);
        }

        .Download-button {
            background-color: white;
            color: rgb(108,117,115);
            padding:15px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .Download-button:hover{
            background-color: rgb(108,117,115);
            color:white;
        }
        .LinkedIn-button {
            background-color: rgb(10, 102, 194);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            margin-left: 50px;
            transition: background-color 0.3s;
        }
        .LinkedIn-button:hover{
           background-color: darkblue;
        }

        .Save-button {
            background-color: rgb(255, 255, 255);
            color: rgb(10, 102, 194);
            padding: 15px 30px;
            border-radius: 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .Save-button:hover{
            background-color: rgba(170, 195, 219, 0.774);
            border-width: 2px;
            border-color: #0c0c0c;
            border-style: solid;
        }


    </style>
</head>
<body>
    <button class="Uber-button">Request Now</button>
    <button class="Amazon-button">Add to Cart</button>
    <button class="Github-button">Sign Up</button>
    <br>
    <button class="Bootsrap-button">Get Started</button>
    <button class="Download-button">Download</button>
    <button class="LinkedIn-button">Apply on company website</button>
    <button class="Save-button">Save</button>
    
</body>
</html>
